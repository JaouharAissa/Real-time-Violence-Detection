apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stream
  template:
    metadata:
      labels:
        app: stream
    spec:
      containers:
        - name: stream
          image: violence-stream:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: MODEL_PATH
              value: models/phase2_20260415_184926.keras

