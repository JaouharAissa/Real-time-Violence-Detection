apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: violence-ingress
  annotations:
    # Kept for compatibility with older GKE setups; prefer spec.ingressClassName below.
    kubernetes.io/ingress.class: "gce"
spec:
  ingressClassName: gce
  rules:
    - http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /predict
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /alerts
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /stream
            pathType: Prefix
            backend:
              service:
                name: stream
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
