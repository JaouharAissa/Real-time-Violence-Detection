apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: violence-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/your-org/violence-backend:prod
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: postgresql://violence_user:violence_pass@postgres:5432/violence_prod
  - target:
      kind: Deployment
      name: stream
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/your-org/violence-stream:prod
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/your-org/violence-frontend:prod
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: violence_prod

