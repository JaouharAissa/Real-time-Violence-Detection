services:
  backend:
    environment:
      APP_ENV: development
    volumes:
      - ./:/app
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  stream:
    environment:
      APP_ENV: development
    volumes:
      - ./:/app
    command: uvicorn stream_server:app --host 0.0.0.0 --port 8001 --reload

