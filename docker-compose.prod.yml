services:
  backend:
    environment:
      APP_ENV: production
    deploy:
      resources:
        limits:
          memory: 4g
  stream:
    environment:
      APP_ENV: production
    deploy:
      resources:
        limits:
          memory: 4g
  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.example.com}
        VITE_STREAM_URL: ${VITE_STREAM_URL:-https://stream.example.com}

