substitutions:
  _REGION: europe-west1
  _REPO: violence-repo
  _TAG: latest
  _FRONTEND_API_URL: https://api.example.com
  _FRONTEND_STREAM_URL: https://stream.example.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.backend
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.stream
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/stream:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:${_TAG}
      - --build-arg
      - VITE_API_BASE_URL=${_FRONTEND_API_URL}
      - --build-arg
      - VITE_STREAM_URL=${_FRONTEND_STREAM_URL}
      - frontend

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/stream:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:${_TAG}

