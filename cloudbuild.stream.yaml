substitutions:
  _REGION: europe-west1
  _REPO: violence-repo
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.stream
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/stream:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/stream:${_TAG}

